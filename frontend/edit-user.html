<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit User</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Environment Configuration -->
    <script src="js/env-config.js"></script>
  </head>
  <body
    class="bg-gradient-to-br from-slate-50 via-teal-50 to-purple-50 min-h-screen"
  >
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-100">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex justify-between items-center">
          <h1
            class="text-3xl font-bold bg-gradient-to-r from-teal-600 to-purple-600 bg-clip-text text-transparent"
          >
            Edit User
          </h1>
          <a href="index.html" class="btn-outline">
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
            Back to Users
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- API Status -->
      <div
        id="apiStatus"
        class="hidden mb-6 p-4 bg-teal-50 border-l-4 border-teal-500 text-teal-700 rounded-r-lg shadow-sm"
      >
        <div class="flex items-center">
          <svg
            class="animate-spin h-5 w-5 mr-3"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          Connecting to API...
        </div>
      </div>

      <!-- Form Card -->
      <div
        class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100"
      >
        <div class="p-8 md:p-10">
          <!-- Loading state -->
          <div id="loadingState" class="text-center py-12">
            <div
              class="inline-block animate-spin rounded-full h-12 w-12 border-4 border-teal-500 border-t-transparent"
            ></div>
            <p class="mt-4 text-gray-600 font-medium">Loading user data...</p>
          </div>

          <!-- Edit form (hidden initially) -->
          <form id="editUserForm" class="space-y-6 hidden">
            <div>
              <label for="name" class="form-label">Full Name</label>
              <input
                type="text"
                class="form-input"
                id="name"
                name="name"
                required
                placeholder="Enter full name"
              />
            </div>

            <div>
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-input bg-gray-50 cursor-not-allowed"
                id="email"
                name="email"
                required
                readonly
              />
              <p class="text-sm text-gray-500 mt-2">Email cannot be changed</p>
            </div>

            <div>
              <label for="job" class="form-label">Job</label>
              <input
                type="text"
                class="form-input"
                id="job"
                name="job"
                required
                placeholder="Enter job title"
              />
            </div>

            <div>
              <label for="role" class="form-label">Role</label>
              <select class="form-input" id="role" name="role" required>
                <option value="">Loading roles...</option>
              </select>
              <p class="text-sm text-gray-500 mt-2">
                <span id="currentRoleInfo"></span>
              </p>
            </div>

            <!-- Role change confirmation -->
            <div
              id="roleChangeWarning"
              class="hidden bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-lg"
            >
              <div class="flex">
                <div class="flex-shrink-0">
                  <svg
                    class="h-5 w-5 text-amber-400"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M8.257 3.099c.765-1.36 2.722-1.36 3.486 0l5.58 9.92c.75 1.334-.213 2.98-1.742 2.98H4.42c-1.53 0-2.493-1.646-1.743-2.98l5.58-9.92zM11 13a1 1 0 11-2 0 1 1 0 012 0zm-1-8a1 1 0 00-1 1v3a1 1 0 002 0V6a1 1 0 00-1-1z"
                      clip-rule="evenodd"
                    />
                  </svg>
                </div>
                <div class="ml-3">
                  <h3 class="text-sm font-semibold text-amber-800">
                    Role Change Detected!
                  </h3>
                  <p class="mt-1 text-sm text-amber-700">
                    You are about to change this user's role from
                    <strong id="oldRoleName"></strong> to
                    <strong id="newRoleName"></strong>. This action will affect
                    the user's permissions.
                  </p>
                </div>
              </div>
            </div>

            <div
              class="flex flex-col sm:flex-row justify-end gap-3 pt-6 border-t border-gray-100 mt-8"
            >
              <a href="index.html" class="btn-outline">
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                  />
                </svg>
                Cancel
              </a>
              <button type="submit" class="btn-primary" id="saveButton">
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M5 13l4 4L19 7"
                  />
                </svg>
                Save Changes
              </button>
            </div>
          </form>

          <!-- Error state -->
          <div id="errorState" class="text-center py-12 hidden">
            <div class="bg-rose-50 border-l-4 border-rose-400 p-6 rounded-r-lg">
              <div class="flex">
                <div class="flex-shrink-0">
                  <svg
                    class="h-8 w-8 text-rose-400"
                    fill="currentColor"
                    viewBox="0 0 20 20"
                  >
                    <path
                      fill-rule="evenodd"
                      d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                      clip-rule="evenodd"
                    />
                  </svg>
                </div>
                <div class="ml-3 text-left">
                  <h3 class="text-lg font-semibold text-rose-800">
                    Error Loading User
                  </h3>
                  <p class="mt-2 text-sm text-rose-700" id="errorMessage">
                    Failed to load user data.
                  </p>
                  <div class="mt-4">
                    <a href="index.html" class="btn-outline">Back to Users</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script src="js/edit-user.js" type="module"></script>
  </body>
</html>
