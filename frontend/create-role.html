<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create New Role</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/styles.css" />
    <!-- Environment Configuration -->
    <script src="js/env-config.js"></script>
  </head>
  <body
    class="bg-gradient-to-br from-slate-50 via-teal-50 to-purple-50 min-h-screen"
  >
    <!-- Header -->
    <header class="bg-white shadow-sm border-b border-gray-100">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="flex justify-between items-center">
          <h1
            class="text-3xl font-bold bg-gradient-to-r from-teal-600 to-purple-600 bg-clip-text text-transparent"
          >
            Create New Role
          </h1>
          <a href="roles.html" class="btn-outline">
            <svg
              class="w-5 h-5"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M10 19l-7-7m0 0l7-7m-7 7h18"
              />
            </svg>
            Back to Roles
          </a>
        </div>
      </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <!-- API Status -->
      <div
        id="apiStatus"
        class="hidden mb-6 p-4 bg-teal-50 border-l-4 border-teal-500 text-teal-700 rounded-r-lg shadow-sm"
      >
        <div class="flex items-center">
          <svg
            class="animate-spin h-5 w-5 mr-3"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            ></path>
          </svg>
          Connecting to API...
        </div>
      </div>

      <!-- Success/Error Messages -->
      <div id="messageContainer"></div>

      <!-- Form Card -->
      <div
        class="bg-white rounded-2xl shadow-xl overflow-hidden border border-gray-100"
      >
        <div class="p-8 md:p-10">
          <form id="createRoleForm" class="space-y-6">
            <div>
              <label for="roleName" class="form-label">Role Name</label>
              <input
                type="text"
                class="form-input"
                id="roleName"
                name="roleName"
                required
                maxlength="50"
                placeholder="Enter role name"
              />
              <p class="text-sm text-gray-500 mt-2">
                A unique identifier for this role (e.g., Admin, Moderator, User)
              </p>
            </div>

            <div>
              <label for="roleDescription" class="form-label"
                >Description</label
              >
              <textarea
                class="form-input"
                id="roleDescription"
                name="roleDescription"
                rows="4"
                maxlength="255"
                placeholder="Enter role description (optional)"
              ></textarea>
              <p class="text-sm text-gray-500 mt-2">
                Optional description of the role's responsibilities and
                permissions
              </p>
            </div>

            <div
              class="flex flex-col sm:flex-row justify-end gap-3 pt-6 border-t border-gray-100 mt-8"
            >
              <a href="roles.html" class="btn-outline">
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M6 18L18 6M6 6l12 12"
                  />
                </svg>
                Cancel
              </a>
              <button type="submit" class="btn-primary">
                <svg
                  class="w-5 h-5"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="M5 13l4 4L19 7"
                  />
                </svg>
                Create Role
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <script src="js/create-role.js" type="module"></script>
  </body>
</html>
